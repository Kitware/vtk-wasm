<html>
  <head>
    <link
      rel="stylesheet"
      href="https://unpkg.com/@kitware/vtk-wasm/viewer.css"
    />
    <script src="https://unpkg.com/@kitware/vtk-wasm/viewer-umd.js"></script>
  </head>
  <body style="margin: 0">
    <a
      href="https://github.com/Kitware/vtk-wasm/blob/main/docs/public/demo/viewer-porsche.html"
      target="_blank"
      rel="noopener noreferrer"
      style="position: fixed; top: 12px; right: 12px; z-index: 9999; padding: 6px 12px; background: #1a1a1a; color: #fff; font: 600 12px/1.4 -apple-system, system-ui, sans-serif; text-decoration: none; border-radius: 6px; border: 1px solid #333; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);"
      >View source on GitHub</a
    >
    <div id="viewer"></div>
    <script>
      vtkWASMViewer
        .createViewerAsync(
          "#viewer",
          "/vtk-wasm/data/porsche.wazex",
          "https://raw.githack.com/Kitware/vtk-wasm/dist/latest/vtk-wasm32-emscripten.tar.gz",
          {
            rendering: "webgl",
          },
        )
        .then((viewer) => {
          // ------------------------------------------------------------
          // enable picking in pure JS
          // ------------------------------------------------------------
          const renderWindow = viewer.remoting.getVtkObject(1);
          const renderer = viewer.remoting.getVtkObject(3);
          const property = viewer.remoting.getVtkObject(515);
          const picker = viewer.remoting.getVtkObject(513);
          const interactor = viewer.remoting.getVtkObject(509);
          // ------------------------------------------------------------

          let pickingPending = false;
          let lastActor = null;

          async function pick() {
            if (pickingPending) {
              return;
            }
            try {
              pickingPending = true;
              const pos = await interactor.getEventPosition();
              const found = await picker.pick([...pos, 0], renderer);
              if (found) {
                if (lastActor) {
                  (await lastActor.getProperty()).deepCopy(property);
                }
                lastActor = await picker.getActor();
                const actorProp = await lastActor.getProperty();
                await property.deepCopy(actorProp);
                await actorProp.setColor(1, 0, 1);
                await actorProp.edgeVisibilityOn();
              }
              await renderWindow.render();
            } finally {
              pickingPending = false;
            }
          }
          interactor.$observe("MouseMoveEvent", pick);
        });
    </script>
  </body>
</html>
