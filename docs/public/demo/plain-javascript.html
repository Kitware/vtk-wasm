<html>
  <head>
    <script src="https://unpkg.com/@kitware/vtk-wasm/vtk-umd.js"></script>
    <script src="example.js"></script>
  </head>
  <body>
    <a
      href="https://github.com/Kitware/vtk-wasm/blob/main/docs/public/demo/plain-javascript.html"
      target="_blank"
      rel="noopener noreferrer"
      style="position: fixed; top: 12px; right: 12px; z-index: 9999; padding: 6px 12px; background: #1a1a1a; color: #fff; font: 600 12px/1.4 -apple-system, system-ui, sans-serif; text-decoration: none; border-radius: 6px; border: 1px solid #333; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);"
      >View source on GitHub</a
    >
    <canvas id="vtk-wasm-window" tabindex="-1" onclick="focus()"></canvas>
    <script>
      vtkwasm.loadAsync({ url: "https://raw.githack.com/Kitware/vtk-wasm/dist/latest/vtk-wasm32-emscripten.tar.gz" })
      .then((runtime) => {
        const session = runtime.createStandaloneSession();
        buildWASMScene(session.vtk, "#vtk-wasm-window", "This scene passes the VTK.wasm bundle from GitLab registry to loadAsync()");
      });
    </script>
  </body>
</html>
