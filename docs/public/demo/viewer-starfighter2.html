<html>
  <head>
    <link
      rel="stylesheet"
      href="https://unpkg.com/@kitware/vtk-wasm/viewer.css"
    />
    <script src="https://unpkg.com/@kitware/vtk-wasm/viewer-umd.js"></script>
  </head>
  <body style="margin: 0">
    <a
      href="https://github.com/Kitware/vtk-wasm/blob/main/docs/public/demo/viewer-starfighter2.html"
      target="_blank"
      rel="noopener noreferrer"
      style="position: fixed; top: 12px; right: 12px; z-index: 9999; padding: 6px 12px; background: #1a1a1a; color: #fff; font: 600 12px/1.4 -apple-system, system-ui, sans-serif; text-decoration: none; border-radius: 6px; border: 1px solid #333; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);"
      >View source on GitHub</a
    >
    <div id="viewer"></div>
    <script>
      vtkWASMViewer
        .createViewerAsync(
          "#viewer",
          "/vtk-wasm/data/star-fighter2.wazex",
          "https://raw.githack.com/Kitware/vtk-wasm/dist/latest/vtk-wasm32-emscripten.tar.gz",
          {
            rendering: "webgl",
          },
        )
        .then((viewer) => {
          const widget = viewer.remoting.getVtkObject(58);
          const plane = viewer.remoting.getVtkObject(25);

          widget.$observe("InteractionEvent", () => {
            plane.origin = widget.widgetRepresentation.origin;
            plane.normal = widget.widgetRepresentation.normal;
          });
        });
    </script>
  </body>
</html>
