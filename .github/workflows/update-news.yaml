name: Update news.md

on:
  schedule:
    - cron: "0 6 * * 1"  # every Monday at 06:00 UTC
  workflow_dispatch:      # allow manual runs

permissions:
  contents: write
  pull-requests: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          token: ${{ secrets.GH_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update news.md
        run: python scripts/update-news.py

      - name: Install LLM dependencies
        run: pip install anthropic

      - name: Draft changelog entries from merged MRs
        env:
          GL_VTK_VTK_TOKEN: ${{ secrets.GL_VTK_VTK_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/update-news-content.py

      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/news.md
          if git diff --cached --quiet; then
            echo "No changes to news.md"
            exit 0
          fi
          BRANCH="docs/update-news-$GITHUB_RUN_ID"
          git checkout -b "$BRANCH"
          git commit -m "docs: update news"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "docs: update news" \
            --body "Auto-generated news update for docs/news.md. Please review before merging."
